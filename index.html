<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Tracker">
<title>Lucas Gold Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--ink:#221c0e;--gold:#d4a017;--gold2:#f5ce56;--goldbg:#fff6d6;--goldline:#e2bf55;--brown:#6b4f0e;--bg:#faf7ef;--card:#fff;--text:#1b1a17;--muted:#5d5a52;--line:#e7e1d2;--red:#b42318;--redbg:#fdecea;--green:#13753a;--greenbg:#e7f6ec;--blue:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font-family:inherit}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.netbar{flex-basis:100%;order:9;border:0;border-radius:10px;min-height:44px;padding:8px 12px;font:inherit;font-size:15px;font-weight:800;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;background:#5a1f17;color:#fff}
.netbar.sync{background:#3a3020;color:var(--gold2)}
.netbar .go{margin-left:auto;font-weight:600;font-size:13px;opacity:.85;white-space:nowrap}
.qcard{border:2px dashed var(--goldline);background:#fffbea}
.item.pend,tr.pend td{background:#fffbea}
.item.pend .no{color:#8a5a00}
.badge.syncing{background:#3a3020;color:var(--gold2)}
.badge.syncing::before{content:"⟳\00a0"}
.item.q .no{font-size:20px;min-width:40px}
.qerr{display:block;color:var(--red);font-size:14px;font-weight:700;margin-top:3px}
.qhold{display:block;color:#8a5a00;font-size:14px;font-weight:700;margin-top:3px}
.note{font-size:14px;color:var(--muted);margin:-6px 0 12px;text-align:center}
.offq{margin-top:8px;font-size:14px;font-weight:700;color:#8a5a00}
header h1{margin:0;font-size:19px;font-weight:800;white-space:nowrap}
header h1 span{color:var(--gold2)}
.basepill{flex:1 1 0;margin-left:auto;text-align:right;line-height:1.15;min-width:0;border:0;background:#2e2615;color:#fff;border-radius:12px;padding:6px 10px;min-height:46px;cursor:pointer;font:inherit}
.basepill:hover{background:#3a3020}
.basepill .pen{font-size:12px;margin-left:4px;opacity:.85}
.basepill b{display:block;color:var(--gold2);font-size:17px;white-space:nowrap}
.basepill small{color:#d8d1bd;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hbtn{border:0;background:#3a3020;color:#fff;border-radius:12px;min-width:46px;min-height:46px;font-size:20px;cursor:pointer}
.hbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:14px 14px calc(100px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--ink);font-weight:800}
nav button.on .ic{transform:scale(1.12)}
nav button.on::after{content:"";display:block;width:28px;height:3px;border-radius:3px;background:var(--gold);margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);border:1px solid #efe9da}
.card h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted,small{color:var(--muted);font-size:14px}
label{display:block;font-size:15px;font-weight:700;margin:12px 0 5px;color:#2f2b22}
label .hint{font-weight:500;color:var(--muted);font-size:13px}
input,select{width:100%;font-size:19px;padding:12px;border:2px solid #d6cfbd;border-radius:12px;background:#fff;min-height:54px;color:var(--text)}
/* v14: the box being edited is unmistakable: 3px dark-amber edge + bright amber ring + glow + tinted fill, and its label lights up. */
input:focus,select:focus,input:focus-visible,select:focus-visible{outline:none;border:3px solid #b45309;padding:11px;background:#fff4cc;box-shadow:0 0 0 3px #fbbf24,0 0 18px 4px rgba(245,158,11,.55)}
input[type=date]:focus{background:#fff4cc}
label.flbl{width:fit-content;max-width:calc(100% + 16px);background:#ffd95a;color:#221c0e;font-weight:900;border-radius:7px;padding:0 8px;margin-left:-8px;margin-right:-8px;box-shadow:0 0 0 1px #b45309}
label.flbl .hint{color:#3d2c00;font-weight:500}
input.bigin{font-size:30px;font-weight:800;text-align:center;min-height:70px}
/* v32: an empty Buy / edit purity box shows just a centered "%", like the Quote box */
input.pur:placeholder-shown{text-align:center}
input.pur::placeholder{font-weight:800;font-size:1.25em;color:#6b6456;opacity:1}
/* Quote purity box: a spreadsheet-style cell. The whole box is the tap target; focus = Excel-like green selection. */
.cell{display:block;cursor:text;background:#fff;border:2px solid #8f8771;border-radius:12px;padding:6px;transition:border-color .1s,box-shadow .1s}
.cell input.bigin{border:0;box-shadow:none;min-height:84px;font-size:38px;border-radius:8px;background:transparent;caret-color:#b45309}
.cell input.bigin:focus{border:0;box-shadow:none;padding:12px;background:transparent}
.cell:focus-within{border:3px solid #b45309;padding:5px;background:#fff4cc;box-shadow:0 0 0 3px #fbbf24,0 0 18px 4px rgba(245,158,11,.55)}
.cell input::selection{background:#ffd95a;color:var(--text)}
.cellhint{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:800;min-height:56px;margin-top:14px;background:var(--ink);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.sec{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-size:15px;font-weight:700;min-height:44px;padding:10px}
.bqsec h2{font-size:15px;color:var(--muted)}
.btn.light{background:#efe9da;color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{display:inline-block;width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:15px}
.quote{background:var(--goldbg);border:2px solid var(--goldline);border-radius:14px;padding:16px;margin-top:14px;text-align:center}
.quote .lbl{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--brown)}
.quote .price{font-size:44px;font-weight:900;color:#3d2c00;line-height:1.1;margin:4px 0 2px;word-break:break-all}
.quote .price .u{font-size:17px;font-weight:700;color:var(--brown)}
.quote .subs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quote .subs div{background:#fff;border-radius:10px;padding:8px}
.quote .subs b{display:block;font-size:19px}
.quote .subs.one{grid-template-columns:1fr}
/* Fine print for Iyam only: small, light grey (about 2.4:1 on the quote and page backgrounds), hard to read from across the counter. */
.fine{font-size:11px;line-height:1.35;font-weight:400;color:#a8a294;text-align:center;margin-top:2px}
.fine b{font-weight:400}
.seglbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#efe9da;border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;min-height:48px;font:inherit;font-size:17px;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.seg.two2{grid-template-columns:1fr 1fr}
#modeSeg{margin:0 0 14px}
#modeSeg button{min-height:52px;font-size:18px}
.qmini{margin-top:12px;text-align:center;font-size:16px;color:var(--brown)}
.qmini b{font-size:22px;color:#3d2c00}
.bqmain{border:2px solid var(--goldline)}
.bqmain h2{font-size:20px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold2);font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stk{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #efe9da;border-left:6px solid var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stk h3{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stk .sumlist{margin-top:0}
.stk .sumlist div:last-child{border-bottom:0}
.stkwrap{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media (min-width:900px){.stkwrap{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:stretch}.stkwrap>.stk.main{grid-column:1/-1}}
/* v35: Total in stock spans the whole width (totals + its two parts); under it the week chart (left) and bought today (right), same height */
/* v10: Total in stock is the main Dashboard card */
/* v30: grams bought per day (one Sun–Sat week) */
.stk.wk{background:#fff;border:2px solid var(--line);padding:14px 14px 10px}
.wknav{display:flex;gap:6px}
.wknav button{min-width:44px;min-height:40px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:24px;font-weight:900;line-height:1;cursor:pointer}
.wknav button:disabled{opacity:.3;cursor:default;border-color:var(--line)}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:700}
.wkhead b{font-size:20px;color:var(--ink);white-space:nowrap}
.wkbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end}
.wkd{display:flex;flex-direction:column;align-items:center;min-width:0}
.wkv{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;min-height:16px;letter-spacing:-.2px}
.wkbar{width:100%;max-width:46px;height:110px;display:flex;align-items:flex-end;background:#f4efe1;border-radius:6px 6px 0 0;overflow:hidden}
.wkbar i{display:block;width:100%;background:var(--ink);border-radius:6px 6px 0 0}
/* v33: stacked bars inside the day's bar (same total height as before): not sold yet (gold) on top of sold (green).
   v34: the marker class is wk2, not "two": the desktop layout rule .two{grid-template-columns:1fr 1fr} turned the 7 days into 2 columns */
.wkbars.wk2 .wkd .wkbar i{display:flex;flex-direction:column;overflow:hidden}
.wkbar i .wu,.wkbar i .ws{display:block;width:100%;flex:none}
.wkbar i .wu,.wkleg i.wu{background:var(--gold)}
.wkbar i .ws,.wkleg i.ws{background:var(--green)}
.wkleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:700}
.wkleg span{display:inline-flex;align-items:center;gap:5px}
.wkleg i{display:inline-block;width:11px;height:11px;border-radius:3px}
.wkleg b{color:var(--ink)}
.wkd.today .wkbar i{background:var(--gold)}
.wkd.today .wkl b{background:var(--gold);color:var(--ink);border-radius:6px;padding:0 4px}
.wkd.fut .wkbar{background:repeating-linear-gradient(45deg,#f7f3e8,#f7f3e8 4px,#fff 4px,#fff 8px)}
.wkd.fut .wkl{opacity:.5}
.wkl{font-size:12px;color:var(--muted);text-align:center;line-height:1.25;margin-top:4px}
.wkl b{font-size:14px;color:var(--ink)}
.wkempty{padding:6px 0 2px;text-align:center}
.wknote{margin-top:6px;font-size:13px}
@media (max-width:360px){.wkv{font-size:10.5px}.wkbar{height:90px}}
.tiles .tile.wide{grid-column:1/-1}
.stk.main{background:var(--goldbg);border:2px solid var(--goldline);border-left:8px solid var(--ink);padding:16px 18px}
.stk.main h3{font-size:20px;color:var(--brown)}
.stk.main{container-type:inline-size;container-name:stkmain;min-width:0}
.stk .figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
@container stkmain (min-width:640px){.stk .figs{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container stkmain (max-width:299px){.stk .figs{grid-template-columns:minmax(0,1fr)}}   /* v20 rule kept: very narrow phones, one figure per row */
/* v35: the two parts of Total in stock (not refined yet / refined, not sold): same rows, side by side when there is room */
.parts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
@container stkmain (min-width:560px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.part{background:#fff;border-radius:10px;padding:8px 12px 4px;border:1px solid #efe4c4;min-width:0}
.part h4{margin:0 0 2px;font-size:14px;font-weight:800;color:var(--brown);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.part h4 small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.part .pl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:15px;min-height:28px}
.part .pl>span{color:var(--muted);font-weight:700;font-size:14px;min-width:0}
.part .pl>span small{display:block;font-size:12px;font-weight:600}
.part .pl b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
#pRef{border-left:4px solid var(--gold)}
#dToday .sumlist .tcap{padding:2px 0 0;border-bottom:0;font-size:13px;font-weight:800;color:var(--brown)}
#dToday .tsum{border-top:2px solid var(--line)}
#dToday .tsum b{font-size:18px}
.stk .figs div{background:#fff;border-radius:10px;padding:8px 10px;min-width:0}
.stk .figs span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.stk .figs b > .fv{display:inline;font-size:inherit;color:inherit;font-weight:inherit}   /* v20: the number inside the figure (label spans above) */
.stk .figs b{display:block;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .profrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:10px;padding:8px 10px}
.stk .profrow>span{font-size:14px;color:var(--muted);font-weight:700}   /* v35: '>' so the profit figure (span.pv) keeps its big size and colour */
.stk .profrow b{font-size:26px;font-weight:900;white-space:nowrap}
.all .month{margin:0 0 14px}
.all .month .val{font-size:38px}
.bq{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.bq:last-of-type{border-bottom:0}
.bq .n{min-width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--gold2);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.bq .p{flex:1;min-width:0}
.bq .v{font-weight:900;font-size:19px;text-align:right}
.bq .v small{display:block;font-weight:500;font-size:12px}
.bqbuy{border:0;background:var(--ink);color:var(--gold2);border-radius:10px;min-width:44px;min-height:44px;font-size:17px;cursor:pointer;flex:none}
.btn.buythis{background:var(--green);color:#fff;margin-top:12px}
.pnote{text-align:left;margin:6px 0 0;font-size:12px;color:#8f8771}
.xrf{margin:4px 0 12px;padding:10px 12px;border:2px solid var(--goldline);border-radius:12px;background:var(--goldbg);font-size:14px}
.xrf .xtop{display:flex;flex-direction:column;align-items:stretch;gap:6px}   /* v32: status on its own row, buttons below */
.xrf .xst{font-weight:800;display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}   /* one line; a long file name ends in … */
.xrf .xbtns{display:flex;flex-wrap:wrap;gap:6px}
.xrf .xbtns .btn{width:auto;flex:0 0 auto;margin-top:0;white-space:nowrap}
.xrf .xst.on{color:var(--green)}.xrf .xst.off{color:var(--red)}.xrf .xst.pause{color:var(--brown)}
.xrf .btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.xrf .xlast,.xrf .xwarn,.xrf .xnote{overflow-wrap:break-word}
.xrf .xgap{display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:8px 10px;border:2px solid var(--red);border-radius:10px;background:#fff;color:var(--red);font-weight:800;overflow-wrap:break-word}
.xrf .xgap span{flex:1;min-width:0}
.xrf .xgap .xgx{flex:none;border:0;background:var(--red);color:#fff;font-weight:900;font-size:18px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer}
.xrf .xlast{margin-top:6px;font-weight:700;color:#3d2c00}
.xrf .xwarn{margin-top:6px;font-weight:700;color:var(--red)}
.xrf .xnote{margin-top:6px;font-weight:700;color:var(--blue)}
.xrf .xarm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.xrf .xarm button[aria-pressed=true]{background:var(--ink);color:var(--gold2)}
.xflash{animation:xflash 1.2s ease-out}
@keyframes xflash{0%{box-shadow:0 0 0 4px var(--gold2);background:var(--goldbg)}100%{box-shadow:none}}
.bq .xno{display:block;font-size:12px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.bqmv{border:0;background:var(--goldbg);color:#3d2c00;border:1px solid var(--goldline);border-radius:10px;min-width:44px;min-height:44px;font-size:18px;font-weight:800;cursor:pointer;flex:none}
.bkbox{margin-top:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fffdf6}
.bkbox h3{margin:0 0 4px;font-size:16px}
.bkbox .btn{margin-top:10px}
.bkst{margin-top:8px;font-size:14px;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.bkst.ok{color:var(--green)}.bkst.err{color:var(--red)}.bkst.warn{color:var(--brown)}.bkst.busy{color:var(--blue)}
.bkwarn{color:var(--brown);font-weight:700}
.linkbtn{border:0;background:none;padding:6px 4px;font:inherit;font-size:12px;color:#6b4f0e;text-decoration:underline;cursor:pointer}
.chint{display:inline-block;border:0;background:none;padding:8px 2px;margin-top:2px;font:inherit;font-size:14px;color:#8f8771;cursor:pointer;text-align:left}
.chint b{font-weight:600}
.chint:hover{color:var(--brown)}
.x{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-width:44px;min-height:44px;font-size:17px;cursor:pointer}
.ed{border:0;background:#efe9da;border-radius:10px;min-width:46px;min-height:44px;font-size:18px;cursor:pointer}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .no{font-weight:900;min-width:52px;color:var(--brown)}
.item .body{flex:1;min-width:0}
.item .acts{display:flex;gap:6px}
.pos{color:var(--green)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:700;text-align:center;background:#fbf8f0}
td:first-child{text-align:left;font-weight:800;color:var(--brown)}
td.acts{text-align:right;width:120px}
@media (min-width:900px) and (max-width:1100px){#stockCard th,#stockCard td{padding:9px 4px;font-size:15px}#stockCard td.acts{width:auto}}   /* v28: narrow PC windows: Stock table fits */
tr.tot td{font-weight:900;border-bottom:0;background:#fbf8f0}
/* v33: time bought (small, grey) + purchases saved together in one batch (box) */
.ts{font-size:12px;font-weight:500;color:#8f8771;white-space:nowrap}
td .ts{display:block;margin-top:1px}
.item .no .ts{display:block;font-size:11px;white-space:normal;line-height:1.2;margin-top:2px}
.item .body .ts,.pick .ts{margin-left:6px}
tbody.bgrp td{background:#fffcf2}
tbody.bgrp tr:first-child td{border-top:2px solid var(--goldline)}
tbody.bgrp tr:last-child td{border-bottom:2px solid var(--goldline)}
tbody.bgrp td:first-child{border-left:4px solid var(--gold)}
tbody.bgrp td:last-child{border-right:2px solid var(--goldline)}

<body>
<header>
  <h1>Lucas <span>Gold</span></h1>
  <button type="button" class="basepill" id="basePill" aria-label="Set base price" title="Set base price"><b>₱—</b><small>Not connected</small></button>
  <button class="hbtn" id="refreshBtn" title="Refresh from the sheet" aria-label="Refresh">⟳</button>
  <button class="hbtn" id="setBtn" title="Settings" aria-label="Settings">⚙️</button>
  <button type="button" class="netbar hidden" id="netbar" onclick="go('stock')"></button>
</header>
<main id="app"></main>
<nav>
  <div class="side-brand">Lucas <span>Gold Tracker</span></div>
  <button data-v="quote" class="on"><span class="ic">💰</span>Quote</button>
  <button data-v="buy"><span class="ic">➕</span>Buy</button>
  <button data-v="stock"><span class="ic">📦</span>Stock</button>
  <button data-v="sales"><span class="ic">🔥</span>Refining</button>
  <button data-v="dash"><span class="ic">📊</span>Dashboard</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const APP_VERSION = 35;
const CFG_KEY = 'gold-tracker-config', CACHE_KEY = 'gold-tracker-state', BQ_KEY = 'gold-tracker-batchquote', Q_KEY = 'gold-tracker-queue', DED_KEY = 'gold-tracker-deduction', LQ_KEY = 'gold-tracker-lastquote', QM_KEY = 'gold-tracker-quotemode', BB_KEY = 'gold-tracker-batchbuy', TM_KEY = 'gold-tracker-tabmask', RN_KEY = 'gold-tracker-sellbase', BE_KEY = 'gold-tracker-batchest';
const OFFLINE_MSG = "You're offline. This needs internet.";
const SYNC_EVERY_MS = 60000;
// The sheet remembers a request ID for 6 hours (Api.gs v2; 10 minutes on v1). After that, a retry of a
// purchase whose first try may have reached the sheet is checked against Stock first instead of being sent blind.
const dedupeSafeMs = () => (ST && Number(ST.version) >= 2) ? 5.5 * 3600e3 : 9 * 60000;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Money: rounded to the cent in decimal (1.005 -> 1.01, never "−₱0.00"), shown as #,##0.00.
const round2 = n => { n = Number(n); const a = Math.abs(n), r = Number(Math.round(a + 'e2') + 'e-2'), v = Math.sign(n) * (isFinite(r) ? r : Math.round(a * 100) / 100); return v === 0 ? 0 : v; };   // half away from zero
const num = n => round2(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// v26: quoted buy prices are cut down to a multiple of ₱5, no centavos (6983.47 -> 6980, 6985 -> 6985); v27: applied to the per-BHY price. Works in whole
// centavos first (tiny float noise like 6984.999999 counts as 6985.00), so a price never drops a step by float error.
const floor5 = n => { n = Number(n); if (!isFinite(n) || n <= 0) return 0; const c = Math.floor(Math.round(n * 1e6) / 1e4); return Math.floor(c / 500) * 5; };
const peso0 = n => { if (n == null || n === '' || isNaN(n)) return '–'; return '₱' + Math.round(Number(n)).toLocaleString('en-GB'); };
const peso = n => { if (n == null || n === '' || isNaN(n)) return '–'; const v = round2(n); return (v < 0 ? '−₱' : '₱') + num(Math.abs(v)); };
const sgn = n => n == null ? '' : (round2(n) < 0 ? 'neg' : 'pos');
// ---------- profit privacy, per tab (v16) ----------
// Every profit eye controls its own group of profit figures ("tab:group"). Tabs with profit: Stock, Refining, Dashboard.
// Each of those tabs has a main toggle at the top with its OWN state, "Hidden" or "Shown" (its label). Tapping it flips that
// state and forces every profit figure (every eye) on the tab to match. Flipping a single eye changes only that eye's figures;
// the main toggle's state and label stay as they are. Main + eye states are saved per tab on this device (default: all
// hidden) and restored on every re-render and reload, so the app opens as it was left.
// Buy (v17): its profit (desktop "Last added" list) is ALWAYS shown, has no eye and no toggle, and no other tab affects it.
// Quote shows no profit.
const MASK = '₱ ••••••';
const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const GROUPS = { stock: ['list', 'refine'], sales: ['batches', 'sales', 'calc', 'refnow'], dash: ['stock', 'month', 'all'] };   // refnow: v18 "If refined now" card
const TABS = Object.keys(GROUPS);
// Saved as { stock: { m: 0|1, list: 0|1, refine: 0|1 }, sales: {...}, dash: {...} }: m = main toggle; 1 = hidden, 0 = shown, missing = hidden.
// Anything else (v15 settings like { stock: 1 }, quote / buy) is dropped.
const readTM = () => { const v = load(TM_KEY); const o = {};
  if (v && typeof v === 'object') TABS.forEach(t => { const x = v[t]; if (x && typeof x === 'object') ['m'].concat(GROUPS[t]).forEach(g => { if (x[g] === 0 || x[g] === 1) { o[t] = o[t] || {}; o[t][g] = x[g]; } }); });
  if (o.sales && (o.sales.m === 0 || o.sales.m === 1) && o.sales.refnow === undefined) o.sales.refnow = o.sales.m;   // v18: the new card starts as the Refining main toggle is
  if (v && JSON.stringify(v) !== JSON.stringify(o)) save(TM_KEY, o);
  return o; };
let TM = readTM();

function beCommit(el, final) {   // final: blur / Enter. Empty Base = the batch base again; empty weight = computed.

    else if (n != null && !isNaN(n) && n >= BASE_MIN && n <= BASE_MAX) { beStore(b, 'base', round2(n)); if (final) el.value = round2(n).toFixed(2); }
    else if (final && n != null && !isNaN(n) && n > 0) toast('Base must be between ₱1,000 and ₱50,000 per gram');

// Sends pending values to the sheet (Api.gs v7). Quiet: a failure keeps them pending for the next refresh.
let beBusy = false;
async function beFlush() {
  if (beBusy || !beV7() || !connected() || !navigator.onLine) return;
  const ids = new Set((ST.batches || []).map(x => x.id));
  let all = beAll(); const todo = Object.keys(all).filter(id => (all[id].pb || all[id].pa) && ids.has(id)); if (!todo.length) return;
  beBusy = true;
  try {
    for (const id of todo) {
      const e = beAll()[id]; if (!e || !(e.pb || e.pa)) continue;
      const sent = { base: e.base, actual: e.actual }, data = { batchId: id };
      if (e.pb) data.sellBase = hasNum(e.base) ? e.base : ''; if (e.pa) data.actualG = hasNum(e.actual) ? e.actual : '';
      let j;
      try { j = await api('setBatchEstimate', data, true, { timeout: 30000 }); }
      catch (err) { if (err.net) break; toast(err.message, 4000); j = { ok: true, failed: true }; }
      all = beAll(); const now = all[id] || {};
      if (data.sellBase !== undefined && now.base === sent.base) now.pb = false;   // changed again meanwhile: stays pending
      if (data.actualG !== undefined && now.actual === sent.actual) now.pa = false;
      all[id] = now; save(BE_KEY, all);
      const b = (ST.batches || []).find(x => x.id === id);
      if (b && !j.failed) { if ('estBase' in j) b.estBase = j.estBase; if ('actualG' in j) b.actualG = j.actualG; save(CACHE_KEY, ST); }
    }
  } finally { beBusy = false; }
  document.querySelectorAll('.best').forEach(box => { const b = beBatch(box); if (b) box.querySelector('.besrc').innerHTML = beSrcHTML(b, beVals(b)); });
}

  const local = pendingQ().map(x => ({ date: String(x.date || ''), grams: Number(x.weightBhy) / bhy, purity: Number(x.purity) || 0, cost: Number(x.cost) || 0, local: true }));

}
function stockSum(L) {

function refSum(R) {

}

// ---------- v30: grams bought per day, one Sunday–Saturday week (Manila), under Total in stock ----------
// Counts every purchase whatever its batch / status: the sheet's getState.daily (Api.gs v9: Purchases + Archive +
// removed Archive rows) plus purchases still waiting to sync. Older sheet: only what is in Stock (with a note).
let dashWeek = 0;   // 0 = this week, -1 = last week, ...
const DAY_MS = 86400000;
const isoUTC = t => new Date(t).toISOString().slice(0, 10);
const utcOf = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
function weekDaily() {
  const s = S() || {}, bhy = s.bhyPerGram || 2, out = {}, add = (d, g) => { d = String(d || '').slice(0, 10); if (/^\d{4}-\d{2}-\d{2}$/.test(d) && g > 0) out[d] = (out[d] || 0) + g; };
  const full = ST && ST.daily && typeof ST.daily === 'object';
  if (full) Object.keys(ST.daily).forEach(k => add(k, Number(ST.daily[k]) || 0));
  else (ST && ST.stock || []).forEach(x => add(x.date, gOf(x, bhy)));
  pendingQ().forEach(x => add(x.date, Number(x.weightBhy) / bhy));
  // v33 (Api.gs v10): grams of each day's purchases that are sold by now (item Sold, or its batch sold); the rest is not sold yet
  const sold = {}, two = full && !!ST.dailySold && typeof ST.dailySold === 'object';
  if (two) Object.keys(ST.dailySold).forEach(k => { const g = Number(ST.dailySold[k]) || 0; if (g > 0 && out[k]) sold[k] = Math.min(g, out[k]); });
  return { out, full, sold, two };
}
function weekInfo(off) {
  const today = todayISO(), t = utcOf(today), start = t - new Date(t).getUTCDay() * DAY_MS + (off || 0) * 7 * DAY_MS;
  return { today, start, days: Array.from({ length: 7 }, (_, i) => isoUTC(start + i * DAY_MS)) };
}
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function weekRangeTxt(a, b) {   // 18 – 24 Oct 2026 · 27 Sep – 3 Oct 2026 · 28 Dec 2025 – 3 Jan 2026
  const A = [+a.slice(8), MON[+a.slice(5, 7) - 1], a.slice(0, 4)], B = [+b.slice(8), MON[+b.slice(5, 7) - 1], b.slice(0, 4)];
  if (A[2] !== B[2]) return `${A.join(' ')} – ${B.join(' ')}`;
  return A[1] === B[1] ? `${A[0]} – ${B[0]} ${B[1]} ${B[2]}` : `${A[0]} ${A[1]} – ${B[0]} ${B[1]} ${B[2]}`;
}
function weekHTML() {
  const W = weekInfo(dashWeek), D = weekDaily(), vals = W.days.map(d => D.out[d] || 0), sv = W.days.map(d => D.sold[d] || 0);
  const tot = vals.reduce((a, x) => a + x, 0), max = Math.max(...vals, 0), sTot = sv.reduce((a, x) => a + x, 0);
  const earlier = Object.keys(D.out).some(k => k < W.days[0] && D.out[k] > 0);
  const gap = ST && ST.dailyGapUntil && W.days[0] <= ST.dailyGapUntil;
  const bars = W.days.map((d, i) => {
    const fut = d > W.today, v = vals[i], s = sv[i], h = max > 0 ? Math.max(v > 0 ? 4 : 0, Math.round(v / max * 100)) : 0;
    const ps = v > 0 ? Math.round(s / v * 10000) / 100 : 0, pu = Math.round((100 - ps) * 100) / 100;   // stacked: shares of the day's bar
    const bar = `<i style="height:${h}%">${D.two && v > 0 ? (pu > 0 ? `<span class="wu" style="height:${pu}%"></span>` : '') + (ps > 0 ? `<span class="ws" style="height:${ps}%"></span>` : '') : ''}</i>`;
    return `<div class="wkd${fut ? ' fut' : ''}${d === W.today ? ' today' : ''}" data-day="${d}" data-g="${round2(v).toFixed(2)}"${D.two ? ` data-s="${round2(s).toFixed(2)}"` : ''} title="${DOW[i]} ${+d.slice(8)} ${MON[+d.slice(5, 7) - 1]}: ${grams(v)} g${D.two && v > 0 ? ` (sold ${grams(s)} g, not sold yet ${grams(v - s)} g)` : ''}">
      <span class="wkv">${fut ? '' : v > 0 ? grams(v) : '0'}</span><div class="wkbar">${bar}</div>
      <span class="wkl">${DOW[i]}<br><b>${+d.slice(8)}</b></span></div>`;
  }).join('');
  return `<div class="stk wk" id="dWeek"><h3><span>Gold bought per day</span>
      <span class="wknav"><button type="button" id="wkPrev" aria-label="Previous week" onclick="weekNav(-1)"${earlier ? '' : ' disabled'}>‹</button><button type="button" id="wkNext" aria-label="Next week" onclick="weekNav(1)"${dashWeek >= 0 ? ' disabled' : ''}>›</button></span></h3>
    <div class="wkhead"><span id="wkRange">${weekRangeTxt(W.days[0], W.days[6])}${dashWeek === 0 ? ' · this week' : ''}</span><b id="wkTotal">${grams(tot)} g</b></div>
    ${tot > 0 ? `<div class="wkbars${D.two ? ' wk2' : ''}" id="wkBars" role="img" aria-label="Grams bought each day, ${weekRangeTxt(W.days[0], W.days[6])}${D.two ? `: ${grams(sTot)} g sold, ${grams(tot - sTot)} g not sold yet` : ''}">${bars}</div>
      ${D.two ? `<div class="wkleg" id="wkLegend"><span><i class="wu"></i>Not sold yet <b id="wkUnsold">${grams(tot - sTot)} g</b></span><span><i class="ws"></i>Sold <b id="wkSold">${grams(sTot)} g</b></span></div>` : ''}`
      : `<div class="wkbars empty" id="wkBars">${bars}</div><div class="empty wkempty" id="wkEmpty">No gold bought ${dashWeek === 0 ? 'this week yet' : 'this week'}.</div>`}
    ${!D.full ? '<div class="muted wknote">Only items in stock are counted. Paste Api.gs v9 and deploy a new version to include refined items.</div>'
      : gap ? `<div class="muted wknote">Refined items removed from the Archive before ${esc(ST.dailyGapUntil)} only have monthly totals, so this week may be missing some.</div>` : ''}</div>`;
}
function weekNav(d) {
  dashWeek = Math.min(0, dashWeek + d);
  const el = $('#dWeek'); if (el) el.outerHTML = weekHTML();
}

// Dashboard (v10): stock first; this month's profit and the all-time totals folded into one dropdown.
let dashOpen = false;
function dashHTML() {
  const d = ST.dashboard || {}, m = ST.month;
  const month = m ? `<div class="month" id="monthCard"><div class="lbl" id="mName">${esc(m.name)} profit</div>
      <div class="big"><span class="val fit" id="mProfit">${prof(m.realizedProfit, 'dash:month')}</span>${eyeBtn('dash:month')}</div>
      <div class="sec">Purchases this month <b id="mCost">${peso(m.purchasesCost)}</b></div></div>`
    : `<div class="month" id="monthCard"><div class="lbl">This month's profit</div><div class="sec" style="margin-top:8px">Paste the new Api.gs in Apps Script and deploy a new version to see this.</div></div>`;
  return stockBoxesHTML() + `<details class="all" id="allTime"${dashOpen ? ' open' : ''} ontoggle="dashOpen=this.open; fitNums()"><summary>Profit &amp; totals</summary><div class="inner">
    ${month}
    <div class="eyerow"><span class="muted">All-time totals</span>${eyeBtn('dash:all')}</div>
    <div class="tiles">
    <div class="tile green wide"><div class="lbl">Total realized profit</div><div class="val fit" id="dReal">${prof(d.totalRealized, 'dash:all')}</div></div>
    <div class="tile ink"><div class="lbl">Current base / gram</div><div class="val fit" id="dBase"><span class="fv">${peso(ST.base)}</span></div><div class="muted">${esc(srcTxt())}${ST.lastUpdated ? ' · ' + esc(ST.lastUpdated) : ''}</div></div>
    <div class="tile ink"><div class="lbl">Cash used</div><div class="val fit" id="dCash"><span class="fv">${peso(d.cashUsed)}</span></div></div>
  </div></div></details><div class="muted" style="text-align:center;margin-top:12px">From the Dashboard tab · updated ${esc(whenTxt(lastSync))}</div>`;
}

// Manual base price
function openBase() {
  if (!connected()) return openSettings();
  if (!ST || !ST.base) return toast('Loading from the sheet…');
  modal(`<h2>Set base price</h2><div class="muted">Today's buying base per gram, after the ₱200 adjustment. It replaces the sheet's base until the next automatic update.</div>
    <label for="bb">Base price (₱ / g)</label><input id="bb" class="basein" type="text" inputmode="decimal" autocomplete="off" value="${esc(Number(ST.base).toFixed(2))}">
    <div class="muted" style="margin-top:6px">Now ${peso(ST.base)} / g · ${esc(srcTxt())}${ST.lastUpdated ? ' · ' + esc(ST.lastUpdated) : ''}</div>
    <button class="btn gold" id="bbsave">Save</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  const el = $('#bb'); el.focus(); el.select();
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveBase(); } });
  $('#bbsave').onclick = saveBase;
}
async function saveBase() {
  const v = parseNum($('#bb').value);
  if (v === null || isNaN(v)) return toast('Enter the base price, e.g. 8250');
  if (v < 1000 || v > 50000) return toast('Base must be between ₱1,000 and ₱50,000 / g');
  const base = round2(v);
  if (!confirm(`Set base to ${peso(base)} / g?`)) return;
  const j = await write('setBase', { base }, $('#bbsave'));
  if (j) { closeModal(); render(); toast(safeMsg(j.message || 'Base updated ✓')); }
}
$('#basePill').onclick = openBase;

// ---------- v28: local backup (Settings > Download backup) ----------
// The sheet sends a full .xlsx copy (Api.gs v8 exportBackup). PC Chrome/Edge: saved in a folder picked once
// (handle kept in IndexedDB, permission asked again when needed). Phones / other browsers: a normal download.
const BK_KEY = 'gold-tracker-lastbackup';
const bkDirOK = () => typeof window.showDirectoryPicker === 'function' && !matchMedia('(pointer:coarse)').matches;
const BK = { h: null, perm: '', busy: false, msg: '', cls: '' };
const bkStore = window.__bkStore || idbStore('gold-tracker-backup', 'dir');
const bkSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const bkStamp = d => manilaAt(d || new Date()).replace('T', ' ').replace(':', '');   // Manila time: 2026-10-22 1330
const bkName = (d, k) => `Gold Tracker backup ${bkStamp(d)}${k > 1 ? ` (${k})` : ''}.xlsx`;
function bkBytes(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function backupHTML() {
  const last = load(BK_KEY), dir = bkDirOK();
  const where = dir ? (BK.h ? `Backup folder: <b>${esc(BK.h.name)}</b>${BK.perm && BK.perm !== 'granted' ? ' <span class="bkwarn">(asks for permission on the next backup)</span>' : ''}` : 'No backup folder chosen yet: you pick one on the first backup.')
    : 'Saved to this device\'s Downloads.';
  return `<h3>💾 Backup</h3><div class="muted" id="bkWhere">${where}</div>
    <button type="button" class="btn" id="bkGo" onclick="doBackup()"${BK.busy ? ' disabled' : ''}>${BK.busy ? 'Making backup…' : '⬇️ Download backup'}</button>
    ${dir && BK.h ? `<button type="button" class="linkbtn" id="bkChange" onclick="bkPick()">Change folder</button>` : ''}
    <div class="bkst ${BK.cls}" id="bkStatus" role="status">${BK.msg ? esc(BK.msg) : last ? `Last backup: ${esc(whenTxt(last.at))} · ${esc(bkSize(last.size))} · ${esc(last.name)}` : 'A full copy of the Gold Tracker sheet (.xlsx, opens in Google Sheets).'}</div>`;
}
function bkPaint() { const b = $('#bkBox'); if (b) b.innerHTML = backupHTML(); }
function bkSet(msg, cls) { BK.msg = msg; BK.cls = cls || ''; bkPaint(); }
async function bkPick() {
  let h; try { h = await window.showDirectoryPicker({ id: 'gold-tracker-backup', mode: 'readwrite' }); } catch (e) { return null; }   // cancelled
  BK.h = h; BK.perm = 'granted'; try { await bkStore.put(h); } catch (e) {}
  bkPaint(); return h;
}
async function doBackup() {
  if (BK.busy) return;
  if (!connected()) return toast('Connect to the sheet first');
  if (!navigator.onLine) return bkSet('Offline: a backup needs the internet. Nothing was saved.', 'err');
  let dir = null;
  if (bkDirOK()) {   // ask for the folder / permission first, while the tap still counts
    if (!BK.h) { dir = await bkPick(); if (!dir) return bkSet('No folder chosen, so nothing was saved.', 'warn'); }
    else {
      dir = BK.h; let p = 'prompt';
      try { p = await dir.queryPermission({ mode: 'readwrite' }); if (p !== 'granted') p = await dir.requestPermission({ mode: 'readwrite' }); } catch (e) { p = 'denied'; }
      BK.perm = p;
      if (p !== 'granted') return bkSet('Permission to the backup folder was not given, so nothing was saved. Tap again and choose Allow, or Change folder.', 'err');
    }
  }
  BK.busy = true; bkSet('Getting a full copy from the sheet… (can take up to a minute)', 'busy');
  try {
    let j;
    try { j = await api('exportBackup', null, false, { timeout: 150000 }); }
    catch (e) { throw new Error(/Unknown action/.test(e.message) ? 'Your sheet\'s Api.gs is older than v8. Paste the new Api.gs and make a New version of the deployment.' : e.message); }
    const bytes = bkBytes(j.data || '');
    if (!bytes.length || (j.size && bytes.length !== j.size)) throw new Error('The backup arrived incomplete. Try again.');
    const now = new Date(), mime = j.mime || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', blob = new Blob([bytes], { type: mime });
    let name = bkName(now), where;
    if (dir) {
      for (let k = 2; k < 50; k++) { try { await dir.getFileHandle(name); name = bkName(now, k); } catch (e) { break; } }   // never overwrite an earlier backup
      const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable();
      await w.write(blob); await w.close();
      where = `in the "${dir.name}" folder`;
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
      where = 'to Downloads';
    }
    save(BK_KEY, { at: now.toISOString(), size: bytes.length, name, where });
    BK.busy = false; bkSet(`✓ Backup saved ${where}: ${name} (${bkSize(bytes.length)})`, 'ok'); toast('Backup saved ✓ (' + bkSize(bytes.length) + ')', 3500);
  } catch (e) {
    BK.busy = false; bkSet('✗ Backup failed: ' + (e.net ? (navigator.onLine ? e.message : OFFLINE_MSG) : e.message) + ' Nothing was saved.', 'err');
  }
}
function bkInit() {
  if (!bkDirOK()) return;
  bkStore.get().then(async h => { if (!h || BK.h) return; BK.h = h; try { BK.perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { BK.perm = 'prompt'; } bkPaint(); }).catch(() => {});
}

// Settings
function openSettings() {
  modal(`<h2>⚙️ Settings</h2><div class="muted">Connect to the Gold Tracker sheet's web app. The setup text from Apps Script looks like <b>URL|token</b>; you can paste it whole into the URL box.</div>
    <label for="cu">Web app URL</label><input id="cu" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url)}">
    <label for="ct">Token</label><input id="ct" type="password" autocomplete="off" value="${esc(CFG.token)}">
    <button class="btn gold" id="csave">Save &amp; test</button>
    ${connected() && ST && ST.base ? `<button class="btn" id="cbase">✏️ Set base price <span style="font-weight:600">(now ${peso(ST.base)} / g)</span></button>` : ''}
    ${connected() ? `<div class="bkbox" id="bkBox">${backupHTML()}</div>` : ''}
    ${connected() ? `<button class="btn danger" id="cclear">Disconnect this device</button>` : ''}
    <button class="btn light" onclick="closeModal()">Close</button>
    <div class="muted" style="margin-top:12px;text-align:center">Lucas Gold Tracker v${APP_VERSION}${lastSync ? ' · last synced ' + esc(whenTxt(lastSync)) : ''}</div>`);
  $('#csave').onclick = async () => {
    let u = $('#cu').value.trim(), t = $('#ct').value.trim();
    if (u.includes('|')) { const i = u.lastIndexOf('|'); t = u.slice(i + 1).trim(); u = u.slice(0, i).trim(); }
    if (!validUrl(u)) return toast('That URL does not look right');
    if (t.length < 16) return toast('Enter the token');
    const old = CFG; CFG = { url: u, token: t };
    try { await api('getState'); save(CFG_KEY, CFG); closeModal(); render(); toast('Connected ✓'); }
    catch (e) { CFG = old; alert('Could not connect: ' + e.message); }
  };
  const cb = $('#cbase'); if (cb) cb.onclick = openBase;
  const cc = $('#cclear'); if (cc) cc.onclick = () => { if (!confirm('Disconnect this device? Your sheet is not changed.')) return; CFG = { url: '', token: '' }; ST = null; localStorage.removeItem(CFG_KEY); localStorage.removeItem(CACHE_KEY); closeModal(); render(); };
}
function validUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(x.hostname); } catch (e) { return false; } }
$('#setBtn').onclick = openSettings;
$('#refreshBtn').onclick = () => connected() ? refresh() : openSettings();

// One-tap setup link: index.html#setup=<url>|<token>
async function setupFromHash() {
  const m = location.hash.match(/^#setup=(.+)$/); if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  let s; try { s = decodeURIComponent(m[1]); } catch (e) { return false; }
  const i = s.lastIndexOf('|'); const u = s.slice(0, i).trim(), t = s.slice(i + 1).trim();
  if (i < 0 || !validUrl(u) || t.length < 16) { alert('That setup link is not valid.'); return false; }
  if (!confirm(`Connect this app to your Gold Tracker sheet?\n\n${new URL(u).host}`)) return false;
  const old = CFG; CFG = { url: u, token: t };
  try { await api('getState'); save(CFG_KEY, CFG); toast('Connected ✓'); }
  catch (e) { CFG = old; alert('Could not connect: ' + e.message); }
  render(); return true;
}
window.addEventListener('hashchange', () => { if (/^#setup=/.test(location.hash)) setupFromHash(); else { const v = hashView(); if (v) go(v); } });
const staleRefresh = () => { if (connected() && lastSync && Date.now() - new Date(lastSync).getTime() > 60000) refresh(true); };
window.addEventListener('focus', staleRefresh);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') staleRefresh(); });
window.addEventListener('online', () => { netDown = false; softRender(); if (connected()) refresh(true); });   // refresh syncs the queue first
window.addEventListener('offline', () => softRender());
window.addEventListener('storage', e => { if (e.key === Q_KEY) { loadQ(); softRender(); } if (e.key === TM_KEY) { TM = readTM(); applyEye(); } });
setInterval(() => {   // every 60 s: retry the queue, or check whether the sheet is reachable again
  if (!connected() || !navigator.onLine || busy || syncing) return;
  if (pendingQ().length) syncQueue(); else if (netDown) refresh(true);
}, SYNC_EVERY_MS);
document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
render(); focusQuote(); xrfInit(); bkInit();
setupFromHash().then(done => { if (connected()) { if (!done) refresh(true); else if (pendingQ().length) syncQueue(); } });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
