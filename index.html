<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Tracker">
<title>Lucas Gold Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--ink:#221c0e;--gold:#d4a017;--gold2:#f5ce56;--goldbg:#fff6d6;--goldline:#e2bf55;--brown:#6b4f0e;--bg:#faf7ef;--card:#fff;--text:#1b1a17;--muted:#5d5a52;--line:#e7e1d2;--red:#b42318;--redbg:#fdecea;--green:#13753a;--greenbg:#e7f6ec;--blue:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font-family:inherit}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.basepill{flex:1 1 0}
.netbar{flex-basis:100%;order:9;border:0;border-radius:10px;min-height:44px;padding:8px 12px;font:inherit;font-size:15px;font-weight:800;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;background:#5a1f17;color:#fff}
.netbar.sync{background:#3a3020;color:var(--gold2)}
.netbar .go{margin-left:auto;font-weight:600;font-size:13px;opacity:.85;white-space:nowrap}
.qcard{border:2px dashed var(--goldline);background:#fffbea}
.item.pend,tr.pend td{background:#fffbea}
.item.pend .no{color:#8a5a00}
.badge.syncing{background:#3a3020;color:var(--gold2)}
.badge.syncing::before{content:"⟳\00a0"}
.item.q .no{font-size:20px;min-width:40px}
.qerr{display:block;color:var(--red);font-size:14px;font-weight:700;margin-top:3px}
.qhold{display:block;color:#8a5a00;font-size:14px;font-weight:700;margin-top:3px}
.note{font-size:14px;color:var(--muted);margin:-6px 0 12px;text-align:center}
.offq{margin-top:8px;font-size:14px;font-weight:700;color:#8a5a00}
header h1{margin:0;font-size:19px;font-weight:800;white-space:nowrap}
header h1 span{color:var(--gold2)}
.basepill{margin-left:auto;text-align:right;line-height:1.15;min-width:0;border:0;background:#2e2615;color:#fff;border-radius:12px;padding:6px 10px;min-height:46px;cursor:pointer;font:inherit}
.basepill:hover{background:#3a3020}
.basepill .pen{font-size:12px;margin-left:4px;opacity:.85}
.basepill b{display:block;color:var(--gold2);font-size:17px;white-space:nowrap}
.basepill small{color:#d8d1bd;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hbtn{border:0;background:#3a3020;color:#fff;border-radius:12px;min-width:46px;min-height:46px;font-size:20px;cursor:pointer}
.hbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:14px 14px calc(100px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--ink);font-weight:800}
nav button.on .ic{transform:scale(1.12)}
nav button.on::after{content:"";display:block;width:28px;height:3px;border-radius:3px;background:var(--gold);margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);border:1px solid #efe9da}
.card h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted,small{color:var(--muted);font-size:14px}
label{display:block;font-size:15px;font-weight:700;margin:12px 0 5px;color:#2f2b22}
label .hint{font-weight:500;color:var(--muted);font-size:13px}
input,select{width:100%;font-size:19px;padding:12px;border:2px solid #d6cfbd;border-radius:12px;background:#fff;min-height:54px;color:var(--text)}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,23,.25)}
input.bigin{font-size:30px;font-weight:800;text-align:center;min-height:70px}
/* Quote purity box: a spreadsheet-style cell. The whole box is the tap target; focus = Excel-like green selection. */
.cell{display:block;cursor:text;background:#fff;border:2px solid #8f8771;border-radius:12px;padding:6px;transition:border-color .1s,box-shadow .1s}
.cell input.bigin{border:0;box-shadow:none;min-height:84px;font-size:38px;border-radius:8px;background:transparent;caret-color:#217346}
.cell input.bigin:focus{border:0;box-shadow:none}
.cell:focus-within{border-color:#217346;box-shadow:0 0 0 3px rgba(33,115,70,.35)}
.cell input::selection{background:#c6e5d2;color:var(--text)}
.cellhint{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:800;min-height:56px;margin-top:14px;background:var(--ink);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.sec{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-size:15px;font-weight:700;min-height:44px;padding:10px}
.bqsec h2{font-size:15px;color:var(--muted)}
.btn.light{background:#efe9da;color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{display:inline-block;width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:15px}
.quote{background:var(--goldbg);border:2px solid var(--goldline);border-radius:14px;padding:16px;margin-top:14px;text-align:center}
.quote .lbl{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--brown)}
.quote .price{font-size:44px;font-weight:900;color:#3d2c00;line-height:1.1;margin:4px 0 2px;word-break:break-all}
.quote .price .u{font-size:17px;font-weight:700;color:var(--brown)}
.quote .subs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quote .subs div{background:#fff;border-radius:10px;padding:8px}
.quote .subs b{display:block;font-size:19px}
.quote .subs.one{grid-template-columns:1fr}
/* Fine print for Iyam only: small, light grey (about 2.4:1 on the quote and page backgrounds), hard to read from across the counter. */
.fine{font-size:11px;line-height:1.35;font-weight:400;color:#a8a294;text-align:center;margin-top:2px}
.fine b{font-weight:400}
.seglbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#efe9da;border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;min-height:48px;font:inherit;font-size:17px;font-weight:700;background:transparent;color:var(--muted);cursor:pointer}
.seg.two2{grid-template-columns:1fr 1fr}
#modeSeg{margin:0 0 14px}
#modeSeg button{min-height:52px;font-size:18px}
.qmini{margin-top:12px;text-align:center;font-size:16px;color:var(--brown)}
.qmini b{font-size:22px;color:#3d2c00}
.bqmain{border:2px solid var(--goldline)}
.bqmain h2{font-size:20px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold2);font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stk{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #efe9da;border-left:6px solid var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stk.ink{border-left-color:var(--ink)}
.stk h3{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stk .sumlist{margin-top:0}
.stk .sumlist div:last-child{border-bottom:0}
.stkwrap{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media (min-width:900px){.stkwrap{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
/* v10: Total in stock is the main Dashboard card */
.stk.main{background:var(--goldbg);border:2px solid var(--goldline);border-left:8px solid var(--ink);padding:16px 18px}
.stk.main h3{font-size:20px;color:var(--brown)}
.stk .figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.stk .figs div{background:#fff;border-radius:10px;padding:8px 10px;min-width:0}
.stk .figs span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.stk .figs b{display:block;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .profrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:10px;padding:8px 10px}
.stk .profrow span{font-size:14px;color:var(--muted);font-weight:700}
.stk .profrow b{font-size:26px;font-weight:900;white-space:nowrap}
.all .month{margin:0 0 14px}
.all .month .val{font-size:38px}
.rule{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:#fff;color:var(--brown);border:1px solid var(--goldline)}
.bq{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.bq:last-child{border-bottom:0}
.bq .n{min-width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--gold2);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.bq .p{flex:1}
.bq .v{font-weight:900;font-size:19px;text-align:right}
.bq .v small{display:block;font-weight:500;font-size:12px}
.bqbuy{border:0;background:var(--ink);color:var(--gold2);border-radius:10px;min-width:44px;min-height:44px;font-size:17px;cursor:pointer;flex:none}
.bq .p{min-width:0}
.btn.buythis{background:var(--green);color:#fff;margin-top:12px}
.pnote{text-align:left;margin:6px 0 0;font-size:12px;color:#8f8771}
.linkbtn{border:0;background:none;padding:6px 4px;font:inherit;font-size:12px;color:#6b4f0e;text-decoration:underline;cursor:pointer}
.chint{display:inline-block;border:0;background:none;padding:8px 2px;margin-top:2px;font:inherit;font-size:14px;color:#8f8771;cursor:pointer;text-align:left}
.chint b{font-weight:600}
.chint:hover{color:var(--brown)}
.x{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-width:44px;min-height:44px;font-size:17px;cursor:pointer}
.ed{border:0;background:#efe9da;border-radius:10px;min-width:46px;min-height:44px;font-size:18px;cursor:pointer}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .no{font-weight:900;min-width:52px;color:var(--brown)}
.item .body{flex:1;min-width:0}
.item .acts{display:flex;gap:6px}
.pos{color:var(--green)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:700;text-align:center;background:#fbf8f0}
td:first-child{text-align:left;font-weight:800;color:var(--brown)}
td.acts{text-align:right;width:120px}
tr.tot td{font-weight:900;border-bottom:0;background:#fbf8f0}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tile{background:#fff;border-radius:14px;padding:16px;border:1px solid #efe9da;border-left:6px solid var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.tile .val{font-size:30px;font-weight:900;margin-top:2px;word-break:break-all}
.tile.green{border-left-color:var(--green)}.tile.ink{border-left-color:var(--ink)}
.badge{font-size:12px;padding:4px 9px;border-radius:99px;font-weight:800;white-space:nowrap;background:#fff4d6;color:#8a5a00}
.badge.sold{background:var(--greenbg);color:var(--green)}
.badge.warn{background:var(--redbg);color:var(--red)}
.batch{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.batch .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.batch .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:15px}
.batch .grid span{color:var(--muted)}
.batch .grid>div{min-width:0}
.batch .grid b{white-space:nowrap}
.sale{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.sale:last-child{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.banner{background:#fff4d6;color:#6b4800;border:1px solid var(--goldline);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.banner.err{background:var(--redbg);color:var(--red);border-color:#f4b4ae}
.banner button{margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:92%;text-align:center}
.toast.show{opacity:.94}
.modal{position:fixed;inset:0;background:rgba(20,16,8,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 6px;font-size:20px}
.sumlist{margin-top:8px}
.sumlist div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.sumlist div b{white-space:nowrap}
.sumlist div.big b{font-size:20px}
.hidden{display:none!important}
.eye{border:0;background:#efe9da;color:var(--ink);border-radius:12px;min-width:46px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;flex:none;vertical-align:middle}
.eye svg{width:24px;height:24px}
.eye[aria-pressed=true]{background:var(--ink);color:var(--gold2)}
.pv.masked{letter-spacing:1px;color:var(--muted)!important}
.month{background:var(--goldbg);border:2px solid var(--goldline);border-radius:16px;padding:18px 16px;margin-bottom:12px;text-align:center}
.month .lbl{font-size:18px;font-weight:800;color:var(--brown)}
.month .big{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 6px}
.month .val{font-size:44px;font-weight:900;line-height:1.1;word-break:break-all;color:#3d2c00}
.month .sec{font-size:15px;color:var(--muted)}
details.all{background:var(--card);border:1px solid #efe9da;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
details.all>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;font-weight:800}
details.all>summary::-webkit-details-marker{display:none}
details.all>summary::after{content:"▾";font-size:20px;color:var(--brown);transition:transform .15s}
details.all[open]>summary::after{transform:rotate(180deg)}
details.all .inner{padding:0 16px 16px}
.eyerow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
input.basein{font-size:34px;font-weight:900;text-align:center;min-height:74px}
.kbd{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.calc{margin-top:8px;background:var(--goldbg);border:1px solid var(--goldline);border-radius:12px;padding:10px 12px;font-size:16px}
.calc b{font-size:18px}
.side-brand{display:none}
@media (min-width:900px){
  body{padding-left:230px}
  header{padding:12px 24px}
  header h1{display:none}
  .basepill{margin-left:0;text-align:left;display:flex;gap:14px;align-items:baseline;flex:0 1 auto}
  .basepill small{max-width:none}
  #refreshBtn{margin-left:auto}
  nav{top:0;bottom:0;right:auto;width:230px;flex-direction:column;border-top:0;border-right:1px solid #3a3020;background:var(--ink);padding:0 12px 12px;gap:4px;z-index:7}
  .side-brand{display:block;color:#fff;font-weight:900;font-size:20px;padding:18px 8px 16px;border-bottom:1px solid #3a3020;margin-bottom:10px}
  .side-brand span{color:var(--gold2)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:17px;color:#d8d1bd;min-height:54px;padding:0 14px;border-radius:12px}
  nav button .ic{font-size:21px}
  nav button.on{background:#3a3020;color:#fff}
  nav button.on::after{display:none}
  nav button:hover{background:#2f2718}
  main{max-width:1100px;padding:24px 28px 40px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .tiles{grid-template-columns:1fr 1fr}
  .quote .price{font-size:56px}
  .month .val{font-size:60px}
  .basepill{padding:6px 14px}
  .toast{bottom:28px}
  .modal{align-items:center}
  .modal .sheet{border-radius:18px;max-height:88vh}
  .mobile-only{display:none!important}
}
@media (max-width:899px){.desk-only{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>Lucas <span>Gold</span></h1>
  <button type="button" class="basepill" id="basePill" aria-label="Set base price" title="Set base price"><b>₱—</b><small>Not connected</small></button>
  <button class="hbtn" id="refreshBtn" title="Refresh from the sheet" aria-label="Refresh">⟳</button>
  <button class="hbtn" id="setBtn" title="Settings" aria-label="Settings">⚙️</button>
  <button type="button" class="netbar hidden" id="netbar" onclick="go('stock')"></button>
</header>
<main id="app"></main>
<nav>
  <div class="side-brand">Lucas <span>Gold Tracker</span></div>
  <button data-v="quote" class="on"><span class="ic">💰</span>Quote</button>
  <button data-v="buy"><span class="ic">➕</span>Buy</button>
  <button data-v="stock"><span class="ic">📦</span>Stock</button>
  <button data-v="sales"><span class="ic">🔥</span>Refining</button>
  <button data-v="dash"><span class="ic">📊</span>Dashboard</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const APP_VERSION = 13;
const CFG_KEY = 'gold-tracker-config', CACHE_KEY = 'gold-tracker-state', BQ_KEY = 'gold-tracker-batchquote', Q_KEY = 'gold-tracker-queue', DED_KEY = 'gold-tracker-deduction', LQ_KEY = 'gold-tracker-lastquote', QM_KEY = 'gold-tracker-quotemode';
const OFFLINE_MSG = "You're offline. This needs internet.";
const SYNC_EVERY_MS = 60000;
// The sheet remembers a request ID for 6 hours (Api.gs v2; 10 minutes on v1). After that, a retry of a
// purchase whose first try may have reached the sheet is checked against Stock first instead of being sent blind.
const dedupeSafeMs = () => (ST && Number(ST.version) >= 2) ? 5.5 * 3600e3 : 9 * 60000;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const peso = n => (n == null || isNaN(n)) ? '–' : (Number(n) < 0 ? '−₱' : '₱') + num(Math.abs(Number(n)));
const sgn = n => n == null ? '' : (Number(n) < 0 ? 'neg' : 'pos');
// ---------- profit privacy (hidden on every open; never saved) ----------
let SHOW = false;
const MASK = '₱ ••••••';
const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';

// ---------- config + cached state ----------
let CFG = load(CFG_KEY) || { url: '', token: '' };

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

// ---------- API ----------
async function api(action, data, isPost, opt) {
  opt = opt || {};
  if (!connected()) throw new Error('Set up the connection first (⚙️ Settings).');
  if (!navigator.onLine) throw netError(false, false);
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), opt.timeout || 45000);
  let r;
  try {
    if (isPost) {
      r = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, token: CFG.token, rid: opt.rid || rid() }, data || {})), redirect: 'follow', signal: ctl.signal });
    } else {
      const q = new URLSearchParams(Object.assign({ action, token: CFG.token, t: Date.now() }, data || {}));
      r = await fetch(CFG.url + (CFG.url.includes('?') ? '&' : '?') + q, { redirect: 'follow', cache: 'no-store', signal: ctl.signal });
    }
  } catch (e) { throw netError(true, e.name === 'AbortError'); }
  finally { clearTimeout(tm); }
  if (r.status >= 500 || r.status === 408 || r.status === 429) throw netError(true, false);
  let j; try { j = await r.json(); } catch (e) { if (e.name === 'AbortError' || e.name === 'TypeError') throw netError(true, false); throw new Error('The sheet answered with something unexpected (HTTP ' + r.status + '). Check the web app URL in Settings.'); }
  netDown = false;
  if (!j.ok) { const err = new Error(j.error || 'Something went wrong.'); err.auth = j.auth === false; throw err; }
  if (j.state) setState(j.state);
  return j;
}
// A network failure (offline, no answer, timeout). sent = the request may have reached the sheet.
function netError(sent, timeout) {
  netDown = true;
  const e = new Error(!navigator.onLine ? OFFLINE_MSG : timeout ? 'The sheet took too long to answer. Check your internet and try again.' : 'Could not reach the sheet. Check your internet connection.');
  e.net = true; e.sent = !!sent; return e;
}
function setState(s) {
  // A state built before a purchase reached the sheet (nextNo <= its No.) must not hide that purchase.
  const now = Date.now(); RECENT = RECENT.filter(x => now - x.at < 15 * 60000);
  RECENT.forEach(x => { if (Number(s.nextNo) <= x.item.no && !(s.stock || []).some(y => Number(y.no) === x.item.no)) { s.stock = (s.stock || []).concat([x.item]); s.nextNo = x.item.no + 1; } });
  s._syncedAt = new Date().toISOString(); ST = s; lastSync = s._syncedAt; netErr = ''; save(CACHE_KEY, s);
}
let RECENT = [];   // purchases confirmed by a lite answer: { item, at }
// Puts a confirmed purchase into Stock at once (lite answer: no full state came back).
function applyAdded(j, it) {
  if (!ST) return;
  if (j.state) { const m = (ST.stock || []).find(x => Number(x.no) === Number(j.no)); if (m) RECENT.push({ item: m, at: Date.now() }); return; }   // v1 sheet: full state came back
  const s = S() || {}, bhy = s.bhyPerGram || 2, no = Number(j.no || (j.item && j.item.no));
  if (!(no > 0)) return;
  let item = j.item && Number(j.item.no) === no ? j.item : null;
  if (!item) { const sell = s.base ? s.base * it.purity * it.weightBhy / bhy : null;
    item = { no, date: it.date, weightBhy: it.weightBhy, grams: it.weightBhy / bhy, purity: it.purity, cost: it.cost,
      projSell: sell == null ? null : Math.round(sell * 100) / 100, projProfit: sell == null ? null : Math.round((sell - it.cost) * 100) / 100, status: 'In stock' }; }
  ST.stock = (ST.stock || []).filter(x => Number(x.no) !== no).concat([item]);
  ST.nextNo = Math.max(Number(ST.nextNo) || 0, no + 1);
  if (j.version) ST.version = Math.max(Number(ST.version) || 0, Number(j.version));

// Re-draws without touching a form being typed in (Buy / Quote inputs keep focus and cursor).

// ---------- offline queue (purchases only) ----------
// Each item: { rid, date, weightBhy, purity, cost, createdAt, tries, lastTry, uncertainAt, error, hold, force }
// rid is made once at entry and reused on every retry, so the sheet's request-ID check stops a double save.
let Q = load(Q_KEY) || [], syncing = false, inflight = '';
const loadQ = () => { Q = load(Q_KEY) || []; return Q; };
const saveQ = () => save(Q_KEY, Q);
const pendingQ = () => Q.filter(x => !x.error && !x.hold);
function qUpdate(r, fn) { loadQ(); const it = Q.find(x => x.rid === r); if (it) { fn(it); saveQ(); } return it; }
function qRemove(r) { loadQ(); Q = Q.filter(x => x.rid !== r); saveQ(); }
function enqueue(it) { loadQ(); if (!Q.some(x => x.rid === it.rid)) Q.push(it); saveQ(); }
function stockMatch(it) {
  return (ST && ST.stock || []).find(x => String(x.date) === String(it.date) && Math.abs((x.weightBhy || 0) - it.weightBhy) < 1e-6
    && Math.abs((x.purity || 0) - it.purity) < 1e-7 && Math.abs((x.cost || 0) - it.cost) < 0.005);
}
let syncAgain = false;
async function syncQueue(opt) {
  opt = opt || {};
  if (syncing) { syncAgain = true; return 0; }   // the running pass picks new entries up, in order
  if (!connected() || !loadQ().length) return 0;
  if (!navigator.onLine) { softRender(); return 0; }
  syncing = true; syncAgain = false; softRender();
  let done = 0, gotState = false, lastNo = null, stopped = false;
  const run = async () => {
    const tried = new Set();
    for (;;) {
      // Always the oldest entry not tried in this pass, so entries typed while syncing go out in order.
      const it = loadQ().find(x => !x.error && !x.hold && !tried.has(x.rid));
      if (!it) break;
      const r0 = it.rid; tried.add(r0);
      // First try may have reached the sheet long ago (its request-ID memory has expired): check Stock first.
      if (it.uncertainAt && !it.force && Date.now() - it.uncertainAt > dedupeSafeMs()) {
        try { await api('getState'); gotState = true; } catch (e) { stopped = true; if (!e.net) netErr = e.message; break; }
        const m = stockMatch(it);
        if (m) { qUpdate(r0, x => { x.hold = `May already be saved as #${m.no} (same date, weight, purity and cost). Check Stock, then delete this or tap Send anyway.`; }); continue; }
      }
      qUpdate(r0, x => { x.tries = (x.tries || 0) + 1; x.lastTry = Date.now(); });
      inflight = r0; softRender();
      try {
        const j = await api('addPurchase', { date: it.date, weightBhy: it.weightBhy, purity: it.purity, cost: it.cost, lite: true }, true, { rid: it.rid, timeout: 45000 });
        if (j.state) gotState = true; applyAdded(j, it);
        qRemove(r0); done++; lastNo = j.no || (j.item && j.item.no) || null;   // ok, or duplicate rid = already saved
      } catch (e) {
        if (e.net) { qUpdate(r0, x => { if (e.sent && !x.uncertainAt) x.uncertainAt = Date.now(); }); stopped = true; break; }
        if (e.auth) { netErr = e.message; stopped = true; break; }    // bad token: keep everything, fix in Settings
        qUpdate(r0, x => { x.error = e.message; x.uncertainAt = null; });
      } finally { inflight = ''; }
      softRender();
    }
  };

    if (navigator.locks && navigator.locks.request) await navigator.locks.request('gold-tracker-sync', { ifAvailable: true }, async lock => { if (lock) await run(); });
    else await run();
  } finally { syncing = false; }
  if (syncAgain && !stopped && pendingQ().length) { syncAgain = false; const more = await syncQueue(opt); return done + more; }
  if (done) {
    toast(done === 1 && lastNo ? `Synced as #${lastNo} ✓` : `Synced ${done} purchase${done === 1 ? '' : 's'} ✓`, 3000);
    // Dashboard figures: one background refresh (not needed when the sheet already sent the full state).
    if (!opt.noRefresh && !gotState) { softRender(); try { await api('getState'); } catch (e) {} }
  }
  softRender(); return done;
}
function qDel(r) {
  const it = loadQ().find(x => x.rid === r); if (!it) return;
  if (inflight === r) return toast('Sending this one now. Try again in a moment.');
  if (!confirm(`Delete this unsynced purchase?\n${wt(it.weightBhy)} BHY · ${pct(it.purity)} · cost ${peso(it.cost)} · ${fmtDate(it.date)}\n\nIt has not reached the sheet${it.uncertainAt ? ' (or may have, check Stock)' : ''}.`)) return;
  qRemove(r); render(); toast('Deleted');
}
function qRetry(r, force) { qUpdate(r, x => { x.error = ''; x.hold = ''; if (force) x.force = true; }); render(); syncQueue(); }
function qEdit(r) {

    <div class="row2"><div><label for="qw">Weight (BHY)</label><input id="qw" type="text" inputmode="decimal" value="${esc(it.weightBhy)}"></div>
    <div><label for="qpp">Purity %</label><input id="qpp" type="text" inputmode="decimal" value="${esc(+(it.purity * 100).toFixed(4))}"></div></div>
    <label for="qc">Cost (₱)</label><input id="qc" type="text" inputmode="decimal" value="${esc(it.cost)}">
    <label for="qd">Date</label><input id="qd" type="date" value="${esc(it.date)}">
    <button class="btn" id="qsave">Save &amp; sync</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  $('#qsave').onclick = () => {
    const w = parseNum($('#qw').value), p = toPurity($('#qpp').value), c = parseNum($('#qc').value), d = $('#qd').value;
    if (!(w > 0)) return toast('Enter the weight in BHY'); if (p === null || isNaN(p)) return toast('Enter a valid purity'); if (c === null || isNaN(c) || c < 0) return toast('Enter the cost');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return toast('Pick the date');
    qUpdate(r, x => { x.weightBhy = w; x.purity = p; x.cost = c; x.date = d; x.error = ''; x.hold = ''; });
    closeModal(); render(); toast(navigator.onLine ? 'Saved. Syncing…' : 'Saved offline. Will sync when back online'); syncQueue();

function renderNet() {

const DED_OPTS = [0.005, 0.01, 0.015];
let DED = (() => { const v = Number(load(DED_KEY)); return DED_OPTS.some(x => Math.abs(x - v) < 1e-9) ? v : 0.01; })();
const dedTxt = m => (m * 100).toLocaleString('en-GB') + '%';

    <div class="sumlist">
      <div><span>Items</span><b>${p.count}</b></div>
      <div><span>Raw grams</span><b>${g3(p.rawG)} g</b></div>
      <div><span>Refined grams (est.)</span><b>${g3(p.refinedG)} g</b></div>
      <div><span>Cost of items</span><b>${peso(p.cost)}</b></div>
      <div><span>Refining fee</span><b>${peso(p.fee)}</b></div>
      <div><span>Cost incl. fee</span><b>${peso(p.costInclFee)}</b></div>
      <div><span>Base frozen for this batch</span><b>${peso(p.base)} / g</b></div>
      <div class="big"><span>Est. profit ${eyeBtn()}</span><b>${prof(p.estProfit)}</b></div>
      <div><span>Silver needed</span><b>${g3(p.silverG)} g</b></div>
    </div>
    <label for="rid">Batch ID <span class="hint">leave blank for ${esc(p.defaultBatchId)}</span></label><input id="rid" type="text" placeholder="${esc(p.defaultBatchId)}">
    <button class="btn gold" id="rgo">Refine ${p.count} items</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  $('#rgo').onclick = async () => {
    if (loadQ().length) { closeModal(); render(); return alert('A purchase is waiting to sync. Sync it first so the batch includes it.'); }
    const r = await write('batchRefine', { batchId: $('#rid').value.trim(), expectNos: p.nos }, $('#rgo'));
    if (r) { closeModal(); go('sales'); toast(r.message, 4000); }
  };
}

// Refining & sales
function salesHTML() {
  const B = ST.batches || [];
  const batches = B.length ? B.map(b => `<div class="batch"><div class="top"><b>${esc(b.id)}</b><span class="badge ${b.status === 'Sold' ? 'sold' : b.status === 'Refining' ? '' : 'warn'}">${esc(b.status)}</span></div>
    <div class="grid"><div><span>Date</span><br><b>${fmtDate(b.date)}</b></div><div><span>Items</span><br><b>${esc(b.items ?? '–')}</b></div>
    ${hasNum(b.rawG) ? `<div class="bRaw"><span>Raw weight before refining</span><br><b>${g3(b.rawG)} g</b></div>` : ''}<div><span>Refined (est.)</span><br><b>${g3(b.refinedG)} g</b></div>
    ${hasNum(b.silverG) ? `<div class="bSilver"><span>Silver needed</span><br><b>${g2(b.silverG)} g</b></div>` : ''}<div><span>Base at batch</span><br><b>${peso(b.base)}</b></div>
    ${b.status === 'Refining' ? `<div><span>Cost incl. fee</span><br><b>${peso(b.costInclFee)}</b></div><div><span>Est. profit</span><br><b>${prof(b.estProfit)}</b></div>`
      : `<div><span>Sold</span><br><b>${fmtDate(b.sellDate)}</b></div><div><span>Received</span><br><b>${peso(b.actualValue)}</b></div><div><span>Profit</span><br><b>${prof(b.actualProfit)}</b></div>`}</div>
    <button class="btn ${b.status === 'Refining' ? 'green' : 'light'}" onclick="openSale('${esc(b.id)}')">${b.status === 'Refining' ? '✅ Record sale' : '✏️ Correct sale'}</button></div>`).join('')
    : '<div class="empty">No refining batches yet. Use Batch refine on the Stock screen.</div>';
  const L = ST.sales || [];
  const sales = L.length ? L.map(s => `<div class="sale"><div><b>${fmtDate(s.date)}</b><br><span class="muted">${s.batch ? 'Batch ' + esc(s.batch) : 'Other sale'} · received ${peso(s.actual)}</span></div><b>${prof(s.profit)}</b></div>`).join('')
    : '<div class="empty">No sales recorded yet.</div>';
  return `<div class="two"><div class="card"><h2>Refining batches ${eyeBtn()}</h2>${batches}</div>
    <div class="card"><h2><span>Recent sales <span class="muted">profit</span></span>${eyeBtn()}</h2>${sales}<button class="btn light" onclick="openOtherSale()">＋ Add other sale</button></div></div>`;
}
function openSale(id) {
  const b = (ST.batches || []).find(x => x.id === id); if (!b) return;
  modal(`<h2>${b.recorded ? 'Correct sale' : 'Record sale'} · ${esc(id)}</h2><div class="muted">${g3(b.refinedG)} g refined (est.) · cost incl. fee ${peso(b.costInclFee)}</div>
    <label for="sd">Sell date</label><input id="sd" type="date" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(b.sellDate) ? b.sellDate : todayISO())}">
    <label for="sb">Sell base / gram (₱)</label><input id="sb" type="text" inputmode="decimal" value="${esc(b.sellBase ?? (ST.base || ''))}">
    <label for="sa">Actual amount received (₱) <span class="hint">optional, overrides grams × base</span></label><input id="sa" type="text" inputmode="decimal" value="${esc(b.actualAmt ?? '')}">
    <div id="scalc"></div>
    <button class="btn green" id="sgo">${b.recorded ? 'Save correction' : 'Record sale'}</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  const calc = () => { const base = parseNum($('#sb').value), amt = parseNum($('#sa').value);
    const val = amt != null && !isNaN(amt) ? amt : (base > 0 ? b.refinedG * base : null);
    $('#scalc').innerHTML = val != null ? `<div class="calc" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span>Received ${peso(val)} · profit <b>${prof(val - b.costInclFee)}</b></span>${eyeBtn()}</div>` : ''; };
  ['sb', 'sa'].forEach(k => $('#' + k).addEventListener('input', calc)); calc();
  $('#sgo').onclick = async () => {
    const base = parseNum($('#sb').value), amt = parseNum($('#sa').value);
    if (!$('#sd').value) return toast('Pick the sell date');
    if (!(base > 0) && !(amt >= 0 && amt !== null)) return toast('Enter the sell base or the amount received');
    const j = await write('recordBatchSale', { batchId: id, sellDate: $('#sd').value, sellBase: base > 0 ? base : '', actualAmt: amt != null && !isNaN(amt) ? amt : '' }, $('#sgo'));
    if (j) { closeModal(); render(); toast(j.message, 4000); }
  };
}
function openOtherSale() {
  modal(`<h2>Add other sale</h2><div class="muted">For sales that are not a refining batch.</div>
    <label for="od">Date</label><input id="od" type="date" value="${todayISO()}">
    <div class="row2"><div><label for="oc">Cost (₱)</label><input id="oc" type="text" inputmode="decimal"></div><div><label for="oa">Received (₱)</label><input id="oa" type="text" inputmode="decimal"></div></div>
    <div class="row2"><div><label for="og">Grams <span class="hint">optional</span></label><input id="og" type="text" inputmode="decimal"></div><div><label for="ob">Base / g <span class="hint">optional</span></label><input id="ob" type="text" inputmode="decimal"></div></div>
    <button class="btn green" id="ogo">Save sale</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  $('#ogo').onclick = async () => {
    const c = parseNum($('#oc').value), a = parseNum($('#oa').value);
    if (c === null || isNaN(c)) return toast('Enter the cost'); if (a === null || isNaN(a)) return toast('Enter the amount received');
    const j = await write('addSale', { date: $('#od').value, cost: c, actual: a, grams: $('#og').value, base: $('#ob').value }, $('#ogo'));
    if (j) { closeModal(); render(); toast(j.message, 4000); }
  };
}

// In-stock boxes, from the stock the app already has (getState) plus purchases still on this device.
const manilaToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
function stockRows() {
  const s = S() || {}, bhy = s.bhyPerGram || 2;
  const sheet = (ST.stock || []).map(x => ({ date: String(x.date || ''), grams: x.grams != null ? Number(x.grams) : Number(x.weightBhy) / bhy, purity: Number(x.purity) || 0, cost: Number(x.cost) || 0, local: false }));
  const local = pendingQ().map(x => ({ date: String(x.date || ''), grams: Number(x.weightBhy) / bhy, purity: Number(x.purity) || 0, cost: Number(x.cost) || 0, local: true }));
  return sheet.concat(local);
}
function stockSum(L) {
  const base = Number(ST.base) || 0;
  const t = L.reduce((a, x) => { a.n++; a.g += x.grams; a.c += x.cost; a.v += base * x.purity * x.grams; a.l += x.local ? 1 : 0; return a; }, { n: 0, g: 0, c: 0, v: 0, l: 0 });
  t.p = t.v - t.c; return t;
}
function stockBoxesHTML() {
  const all = stockRows(), today = manilaToday();
  const T = stockSum(all.filter(x => x.date.slice(0, 10) === today)), A = stockSum(all);
  const loc = t => t.l ? ` <span class="muted" style="font-size:13px">incl. ${t.l} not synced yet</span>` : '';
  return `<div class="stkwrap" id="stockMain">
    <div class="stk main" id="dStock"><h3><span>Total in stock</span>${eyeBtn()}</h3>
      <div class="figs">
        <div><span>Items</span><b id="sCount">${A.n}</b></div><div><span>Grams</span><b id="sGrams">${g3(A.g)} g</b></div>
        <div><span>Cost</span><b id="sCost">${peso(A.c)}</b></div><div><span>Est. value at ${peso(ST.base)} / g</span><b id="sValue">${peso(A.v)}</b></div>
      </div>
      <div class="profrow"><span>Est. profit</span><b id="sProfit">${prof(A.p)}</b></div>${loc(A)}</div>
    <div class="stk" id="dToday"><h3><span>In stock – bought today</span></h3><div class="sumlist">
      <div><span>Items</span><b id="tCount">${T.n}</b></div><div><span>Grams</span><b id="tGrams">${g3(T.g)} g</b></div>
      <div><span>Cost</span><b id="tCost">${peso(T.c)}</b></div></div>${loc(T)}</div></div>`;
}

// Dashboard (v10): stock first; this month's profit and the all-time totals folded into one dropdown.
let dashOpen = false;
function dashHTML() {
  const d = ST.dashboard || {}, m = ST.month;
  const month = m ? `<div class="month" id="monthCard"><div class="lbl" id="mName">${esc(m.name)} profit</div>
      <div class="big"><span class="val" id="mProfit">${prof(m.realizedProfit)}</span>${eyeBtn()}</div>
      <div class="sec">Purchases this month <b id="mCost">${peso(m.purchasesCost)}</b></div></div>`
    : `<div class="month" id="monthCard"><div class="lbl">This month's profit</div><div class="sec" style="margin-top:8px">Paste the new Api.gs in Apps Script and deploy a new version to see this.</div></div>`;
  return stockBoxesHTML() + `<details class="all" id="allTime"${dashOpen ? ' open' : ''} ontoggle="dashOpen=this.open"><summary>Profit &amp; totals</summary><div class="inner">
    ${month}
    <div class="eyerow"><span class="muted">All-time totals</span>${eyeBtn()}</div>
    <div class="tiles">
    <div class="tile green"><div class="lbl">Total realized profit</div><div class="val" id="dReal">${prof(d.totalRealized)}</div></div>
    <div class="tile"><div class="lbl">Est. refining profit (items in stock)</div><div class="val" id="dRef">${prof(d.estRefiningProfit)}</div>
      ${d.openBatches ? `<div class="muted">Unsold batches: ${prof(d.openBatchesEstProfit)} est.</div>` : ''}</div>
    <div class="tile ink"><div class="lbl">Current base / gram</div><div class="val" id="dBase">${peso(ST.base)}</div><div class="muted">${esc(srcTxt())}${ST.lastUpdated ? ' · ' + esc(ST.lastUpdated) : ''}</div></div>
    <div class="tile ink"><div class="lbl">Cash used</div><div class="val" id="dCash">${peso(d.cashUsed)}</div></div>
  </div></div></details><div class="muted" style="text-align:center;margin-top:12px">From the Dashboard tab · updated ${esc(when(lastSync))}</div>`;
}

// Manual base price
function openBase() {
  if (!connected()) return openSettings();
  if (!ST || !ST.base) return toast('Loading from the sheet…');
  modal(`<h2>Set base price</h2><div class="muted">Today's buying base per gram, after the ₱200 adjustment. It replaces the sheet's base until the next automatic update.</div>
    <label for="bb">Base price (₱ / g)</label><input id="bb" class="basein" type="text" inputmode="decimal" autocomplete="off" value="${esc(Number(ST.base).toFixed(2))}">
    <div class="muted" style="margin-top:6px">Now ${peso(ST.base)} / g · ${esc(srcTxt())}${ST.lastUpdated ? ' · ' + esc(ST.lastUpdated) : ''}</div>
    <button class="btn gold" id="bbsave">Save</button><button class="btn light" onclick="closeModal()">Cancel</button>`);
  const el = $('#bb'); el.focus(); el.select();
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveBase(); } });
  $('#bbsave').onclick = saveBase;
}
async function saveBase() {
  const v = parseNum($('#bb').value);
  if (v === null || isNaN(v)) return toast('Enter the base price, e.g. 8250');
  if (v < 1000 || v > 50000) return toast('Base must be between ₱1,000 and ₱50,000 / g');
  const base = Math.round(v * 100) / 100;
  if (!confirm(`Set base to ${peso(base)} / g?`)) return;
  const j = await write('setBase', { base }, $('#bbsave'));
  if (j) { closeModal(); render(); toast(j.message || 'Base updated ✓'); }
}
$('#basePill').onclick = openBase;

// Settings
function openSettings() {
  modal(`<h2>⚙️ Settings</h2><div class="muted">Connect to the Gold Tracker sheet's web app. The setup text from Apps Script looks like <b>URL|token</b>; you can paste it whole into the URL box.</div>
    <label for="cu">Web app URL</label><input id="cu" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url)}">
    <label for="ct">Token</label><input id="ct" type="password" autocomplete="off" value="${esc(CFG.token)}">
    <button class="btn gold" id="csave">Save &amp; test</button>
    ${connected() && ST && ST.base ? `<button class="btn" id="cbase">✏️ Set base price <span style="font-weight:600">(now ${peso(ST.base)} / g)</span></button>` : ''}
    ${connected() ? `<button class="btn danger" id="cclear">Disconnect this device</button>` : ''}
    <button class="btn light" onclick="closeModal()">Close</button>
    <div class="muted" style="margin-top:12px;text-align:center">Lucas Gold Tracker v${APP_VERSION}${lastSync ? ' · last synced ' + esc(when(lastSync)) : ''}</div>`);
  $('#csave').onclick = async () => {
    let u = $('#cu').value.trim(), t = $('#ct').value.trim();
    if (u.includes('|')) { const i = u.lastIndexOf('|'); t = u.slice(i + 1).trim(); u = u.slice(0, i).trim(); }
    if (!validUrl(u)) return toast('That URL does not look right');
    if (t.length < 16) return toast('Enter the token');
    const old = CFG; CFG = { url: u, token: t };
    try { await api('getState'); save(CFG_KEY, CFG); closeModal(); render(); toast('Connected ✓'); }
    catch (e) { CFG = old; alert('Could not connect: ' + e.message); }
  };
  const cb = $('#cbase'); if (cb) cb.onclick = openBase;
  const cc = $('#cclear'); if (cc) cc.onclick = () => { if (!confirm('Disconnect this device? Your sheet is not changed.')) return; CFG = { url: '', token: '' }; ST = null; localStorage.removeItem(CFG_KEY); localStorage.removeItem(CACHE_KEY); closeModal(); render(); };
}
function validUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(x.hostname); } catch (e) { return false; } }
$('#setBtn').onclick = openSettings;
$('#refreshBtn').onclick = () => connected() ? refresh() : openSettings();

// One-tap setup link: index.html#setup=<url>|<token>
async function setupFromHash() {
  const m = location.hash.match(/^#setup=(.+)$/); if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  let s; try { s = decodeURIComponent(m[1]); } catch (e) { return false; }
  const i = s.lastIndexOf('|'); const u = s.slice(0, i).trim(), t = s.slice(i + 1).trim();
  if (i < 0 || !validUrl(u) || t.length < 16) { alert('That setup link is not valid.'); return false; }
  if (!confirm(`Connect this app to your Gold Tracker sheet?\n\n${new URL(u).host}`)) return false;
  const old = CFG; CFG = { url: u, token: t };
  try { await api('getState'); save(CFG_KEY, CFG); toast('Connected ✓'); }
  catch (e) { CFG = old; alert('Could not connect: ' + e.message); }
  render(); return true;
}
window.addEventListener('hashchange', () => { if (/^#setup=/.test(location.hash)) setupFromHash(); else { const v = (location.hash.match(/^#(quote|buy|stock|sales|dash)$/) || [])[1]; if (v) go(v); } });
window.addEventListener('focus', () => { if (connected() && lastSync && Date.now() - new Date(lastSync).getTime() > 60000) refresh(true); });
window.addEventListener('online', () => { netDown = false; softRender(); if (connected()) refresh(true); });   // refresh syncs the queue first
window.addEventListener('offline', () => softRender());
window.addEventListener('storage', e => { if (e.key === Q_KEY) { loadQ(); softRender(); } });
setInterval(() => {   // every 60 s: retry the queue, or check whether the sheet is reachable again
  if (!connected() || !navigator.onLine || busy || syncing) return;
  if (pendingQ().length) syncQueue(); else if (netDown) refresh(true);
}, SYNC_EVERY_MS);
document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
render(); focusQuote();
setupFromHash().then(done => { if (connected()) { if (!done) refresh(true); else if (pendingQ().length) syncQueue(); } });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
